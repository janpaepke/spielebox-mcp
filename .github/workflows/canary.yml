# Weekly read-only check against the real catalog: fails when its markup or behavior changed.
# A handful of GET requests (searches and detail pages); never touches the Merkliste or the order form.
name: Catalog canary

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @janpaepke/spielebox-client test:live
