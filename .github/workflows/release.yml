# Publishes a release when a version tag (v1.2.3) is pushed, usually by `pnpm release <version>`:
# checks, builds the Claude Desktop extension, attests its provenance and attaches it to a GitHub release.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # create the release
  id-token: write # sign the provenance attestation
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # previous tags, for the release notes
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check that the tag matches the package versions
        run: |
          version="${GITHUB_REF_NAME#v}"
          for p in packages/client packages/mcp; do
            actual=$(node -p "require('./$p/package.json').version")
            if [ "$actual" != "$version" ]; then
              echo "::error::$p has version $actual, but the tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done

      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - name: Build the Claude Desktop extension
        run: |
          pnpm --filter spielebox-mcp pack:mcpb
          cd packages/mcp/dist && sha256sum spielebox.mcpb > spielebox.mcpb.sha256

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: packages/mcp/dist/spielebox.mcpb

      - name: Write release notes
        run: |
          previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "## Changes"
            echo
            git log --no-merges --format='- %s' "${previous:+$previous..}$GITHUB_REF_NAME" \
              | grep -E '^- (feat|fix|perf)(\(.+\))?!?:' || echo "- Maintenance and documentation"
            echo
            cat .github/release-notes-footer.md
          } > release-notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            packages/mcp/dist/spielebox.mcpb packages/mcp/dist/spielebox.mcpb.sha256 \
            --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
